<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#29aeca">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Summer Adventure">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/pig-cape.png">
  <title>Summer Adventure Check-in</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #eafcff;
      --foreground: #18314c;
      --card: #ffffff;
      --card-foreground: #18314c;
      --muted: #d8f3f7;
      --muted-foreground: #547086;
      --primary: #147fa0;
      --primary-foreground: #ffffff;
      --secondary: #e6f7df;
      --secondary-foreground: #24422f;
      --accent: #fff1bc;
      --accent-foreground: #523c08;
      --border: #b8dbe2;
      --ring: #147fa0;
      --viz-series-1: #1f9ccc;
      --viz-series-2: #f2a623;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #102a35;
        --foreground: #eaf8fb;
        --card: #183945;
        --card-foreground: #edf9fb;
        --muted: #244b58;
        --muted-foreground: #b5d1d8;
        --primary: #73d2ec;
        --primary-foreground: #092733;
        --secondary: #294a3a;
        --secondary-foreground: #e6f5ea;
        --accent: #5e4a1e;
        --accent-foreground: #fff4c8;
        --border: #3d6672;
        --ring: #73d2ec;
        --viz-series-1: #5cc9ee;
        --viz-series-2: #ffc657;
      }
    }

    html {
      background: var(--background);
      overflow-x: hidden;
    }
    body {
      margin: 0;
      min-width: 320px;
      overflow-x: hidden;
      background: var(--background);
      color: var(--foreground);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.45;
    }

    main {
      width: 100%;
      max-width: 1480px;
      margin: 0 auto;
      padding: clamp(10px, 2vw, 24px);
      overflow-x: hidden;
      box-sizing: border-box;
    }

    @media (min-width: 700px) and (max-width: 1366px) {
      main { padding: 8px; }
    }

    button { font: inherit; }
    button:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
    .text-small { font-size: 12px; }
    .text-muted { color: var(--muted-foreground); }
  </style>
</head>
<body>
  <main><div id="summer-checkin-app">
  <style>
    #summer-checkin-app {
      --app-soft: color-mix(in srgb, var(--card) 88%, var(--viz-series-1) 12%);
      --app-soft-2: color-mix(in srgb, var(--card) 90%, var(--viz-series-2) 10%);
      --app-line: color-mix(in srgb, var(--border) 72%, var(--viz-series-1) 28%);
      --flag-red: #e53935;
      color: var(--foreground);
      display: grid;
      gap: 16px;
      max-width: 100%;
      overflow-x: clip;
      position: relative;
      width: 100%;
    }

    #summer-checkin-app * { box-sizing: border-box; }
    #summer-checkin-app > section,
    #summer-checkin-app > div { min-width: 0; }

    #summer-checkin-app .status-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    #summer-checkin-app .status-copy {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    #summer-checkin-app .status-copy strong { font-weight: 500; }

    #summer-checkin-app .reward-totals {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    #summer-checkin-app .reward-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--card);
      color: var(--card-foreground);
      white-space: nowrap;
    }

    #summer-checkin-app .map-shell {
      overflow: hidden;
      border-radius: 8px;
      background: var(--muted);
      max-width: 100%;
    }

    #summer-checkin-app .map-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 2;
      overflow: hidden;
      isolation: isolate;
    }

    #summer-checkin-app .map-stage > img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }

    #summer-checkin-app .wobble-piece {
      position: absolute;
      z-index: 2;
      left: var(--left);
      top: var(--top);
      width: var(--width);
      height: var(--height);
      transform-origin: 50% 78%;
      pointer-events: none;
      animation: island-wobble var(--duration, 3.4s) ease-in-out var(--delay, 0s) infinite alternate;
      will-change: transform;
    }

    #summer-checkin-app .wobble-piece img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
    }

    #summer-checkin-app .wobble-piece.music {
      z-index: 3;
      filter: drop-shadow(0 5px 5px color-mix(in srgb, var(--foreground) 20%, transparent));
    }

    #summer-checkin-app .music-note-dancer,
    #summer-checkin-app .music-speaker {
      position: absolute;
      z-index: 4;
      pointer-events: none;
      transform-origin: 50% 70%;
      will-change: transform, filter;
    }

    #summer-checkin-app .music-note-dancer {
      left: 53.8%;
      top: 36.2%;
      width: 8.8%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      color: #7a3ff2;
      font-size: clamp(34px, 5vw, 78px);
      font-weight: 800;
      text-shadow:
        0 2px 0 #f6d8ff,
        0 5px 8px color-mix(in srgb, var(--foreground) 22%, transparent);
      animation: music-note-dance 1.05s ease-in-out infinite;
    }

    #summer-checkin-app .music-speaker {
      width: 4.1%;
      aspect-ratio: 109 / 145;
      filter: drop-shadow(0 3px 3px color-mix(in srgb, var(--foreground) 18%, transparent));
      animation: speaker-bounce .56s ease-in-out infinite alternate;
    }

    #summer-checkin-app .music-speaker.left {
      left: 48.3%;
      top: 41.8%;
      animation-name: speaker-pulse-left;
    }

    #summer-checkin-app .music-speaker.right {
      left: 58.8%;
      top: 42%;
      animation-name: speaker-pulse-right;
    }

    #summer-checkin-app .music-speaker img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    #summer-checkin-app .hotspot {
      position: absolute;
      left: var(--x);
      top: var(--y);
      z-index: 4;
      transform: translate(-50%, -50%);
      display: block;
      width: 13%;
      height: 17%;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: transparent;
      box-shadow: none;
      cursor: pointer;
      touch-action: manipulation;
      font: inherit;
      font-size: 0;
    }

    #summer-checkin-app .hotspot::after {
      content: none;
    }

    #summer-checkin-app .hotspot:disabled {
      cursor: default;
    }

    #summer-checkin-app .hotspot.is-bump { animation: app-bump .28s ease-out; }

    #summer-checkin-app .scenery-hotspot {
      position: absolute;
      z-index: 5;
      left: var(--x);
      top: var(--y);
      width: var(--w, 8%);
      height: var(--h, 10%);
      transform: translate(-50%, -50%);
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    #summer-checkin-app .scenery-hotspot:active { transform: translate(-50%, -50%) scale(.93); }

    #summer-checkin-app .music-hotspot {
      z-index: 7;
      border-radius: 42%;
    }

    #summer-checkin-app .pig {
      position: absolute;
      left: 8%;
      top: 30%;
      z-index: 6;
      width: clamp(52px, 6.5vw, 92px);
      aspect-ratio: 1;
      transform: translate(-50%, -62%);
      border: 0;
      background: transparent;
      filter: drop-shadow(0 4px 4px color-mix(in srgb, var(--foreground) 28%, transparent));
      pointer-events: none;
      transition: left .46s ease, top .46s ease;
    }

    #summer-checkin-app .pig img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    #summer-checkin-app .map-toast {
      position: absolute;
      left: 50%;
      bottom: 3%;
      z-index: 7;
      transform: translate(-50%, 12px);
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--primary);
      color: var(--primary-foreground);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      white-space: nowrap;
    }

    #summer-checkin-app .map-toast.show { opacity: 1; transform: translate(-50%, 0); }

    #summer-checkin-app .quick-checkins {
      display: grid;
      grid-template-columns: repeat(9, minmax(92px, 1fr));
      gap: 8px;
    }

    #summer-checkin-app .task-btn {
      position: relative;
      min-width: 0;
      display: grid;
      gap: 2px;
      justify-items: start;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--card-foreground);
      cursor: pointer;
      touch-action: manipulation;
      font: inherit;
      text-align: left;
    }

    #summer-checkin-app .task-btn strong {
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
    }

    #summer-checkin-app .task-btn span { color: var(--muted-foreground); }
    #summer-checkin-app .task-btn:disabled { opacity: .55; cursor: default; }

    #summer-checkin-app .activity-head,
    #summer-checkin-app .progress-head,
    #summer-checkin-app .badge-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    #summer-checkin-app .activity-head strong,
    #summer-checkin-app .progress-head strong,
    #summer-checkin-app .badge-head strong { font-weight: 500; }

    #summer-checkin-app .activity-list {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    #summer-checkin-app .activity-item {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      border-left: 3px solid var(--viz-series-1);
      background: var(--app-soft);
      color: var(--foreground);
      border-radius: 0 6px 6px 0;
    }

    #summer-checkin-app .empty-activity {
      color: var(--muted-foreground);
      padding: 8px 0;
    }

    #summer-checkin-app .bottom-zone {
      display: grid;
      gap: 14px;
      padding-top: 14px;
      border-top: 2px solid var(--app-line);
    }

    #summer-checkin-app .progress-track {
      position: relative;
      height: 22px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--muted);
    }

    #summer-checkin-app .progress-wrap { position: relative; padding-top: 28px; }

    #summer-checkin-app .flag-rail {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 30px;
      pointer-events: none;
    }

    #summer-checkin-app .flag-marker {
      position: absolute;
      bottom: 0;
      width: 12px;
      height: 27px;
      transform: translateX(-50%) scale(.82);
      transform-origin: 50% 100%;
      color: var(--muted-foreground);
      opacity: .34;
      transition: color .28s ease, opacity .28s ease, transform .28s ease;
    }

    #summer-checkin-app .flag-marker::before {
      content: "";
      position: absolute;
      left: 2px;
      bottom: 0;
      width: 2px;
      height: 26px;
      border-radius: 999px;
      background: var(--muted-foreground);
    }

    #summer-checkin-app .flag-marker::after {
      content: "";
      position: absolute;
      left: 4px;
      top: 1px;
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 9px solid currentColor;
    }

    #summer-checkin-app .flag-marker.reached {
      color: var(--flag-red);
      opacity: 1;
      transform: translateX(-50%) scale(1);
      text-shadow: 0 1px 2px color-mix(in srgb, var(--foreground) 28%, transparent);
    }

    #summer-checkin-app .flag-marker.reached::before {
      background: color-mix(in srgb, var(--foreground) 72%, var(--flag-red));
    }

    #summer-checkin-app .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--viz-series-1), var(--viz-series-2));
      transition: width .46s ease;
    }

    #summer-checkin-app .progress-label {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--foreground);
      font-weight: 500;
      font-size: 12px;
    }

    #summer-checkin-app .badge-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    #summer-checkin-app .medal {
      min-width: 0;
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr);
      align-items: center;
      gap: 9px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--card-foreground);
      opacity: .48;
      filter: grayscale(1);
    }

    #summer-checkin-app .medal.unlocked {
      opacity: 1;
      filter: none;
      border-color: color-mix(in srgb, var(--viz-series-2) 70%, var(--border));
      background: var(--app-soft-2);
    }

    #summer-checkin-app .medal-mark {
      position: relative;
      display: grid;
      place-items: center;
      width: 46px;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 3px double var(--viz-series-2);
      background: color-mix(in srgb, var(--viz-series-2) 22%, var(--card));
      font-weight: 500;
    }

    #summer-checkin-app .medal.unlocked .medal-mark::after {
      content: "★";
      position: absolute;
      right: -5px;
      top: -7px;
      color: var(--viz-series-2);
    }

    #summer-checkin-app .medal-copy { min-width: 0; }
    #summer-checkin-app .medal-copy strong {
      display: block;
      color: color-mix(in srgb, var(--primary) 72%, var(--foreground));
      font-family: "Comic Sans MS", "Microsoft YaHei", "PingFang SC", cursive;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.2;
    }

    #summer-checkin-app .medal.unlocked .medal-copy strong {
      color: color-mix(in srgb, var(--flag-red) 52%, var(--foreground));
    }

    #summer-checkin-app .medal-copy span {
      display: block;
      margin-top: 4px;
      color: color-mix(in srgb, var(--muted-foreground) 82%, var(--primary));
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: 11px;
      line-height: 1.25;
    }

    #summer-checkin-app .undo-btn {
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
      color: var(--card-foreground);
      cursor: pointer;
      font: inherit;
    }

    #summer-checkin-app .undo-btn:disabled { opacity: .45; cursor: default; }

    #summer-checkin-app .star-pop {
      position: fixed;
      z-index: 20;
      transform: translate(-50%, -50%);
      font-size: clamp(64px, 9vw, 118px);
      line-height: 1;
      filter: drop-shadow(0 6px 5px color-mix(in srgb, var(--foreground) 34%, transparent));
      pointer-events: none;
      animation: star-pop-up .92s cubic-bezier(.18, .86, .2, 1.18) forwards;
    }

    #summer-checkin-app .star-pop::before,
    #summer-checkin-app .star-pop::after {
      content: "✦";
      position: absolute;
      color: var(--primary);
      font-size: .34em;
      filter: none;
      animation: star-spark .72s ease-out forwards;
    }

    #summer-checkin-app .star-pop::before { left: -50%; top: 18%; }
    #summer-checkin-app .star-pop::after { right: -50%; top: -5%; animation-delay: .08s; }

    @keyframes app-bump {
      0% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.18); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes star-pop-up {
      0% { opacity: 0; transform: translate(-50%, -25%) scale(.18) rotate(-28deg); }
      24% { opacity: 1; transform: translate(-50%, -62%) scale(1.45) rotate(12deg); }
      46% { opacity: 1; transform: translate(-50%, -92%) scale(1.12) rotate(-5deg); }
      74% { opacity: 1; transform: translate(-50%, -142%) scale(1.22) rotate(4deg); }
      100% { opacity: 0; transform: translate(-50%, -220%) scale(.72) rotate(16deg); }
    }

    @keyframes star-spark {
      0% { opacity: 0; transform: scale(.2); }
      35% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0; transform: scale(.55) translateY(-18px); }
    }

    @keyframes island-wobble {
      0% { transform: rotate(-2.7deg) translate(-2px, 1px); }
      45% { transform: rotate(.8deg) translateY(-3px); }
      100% { transform: rotate(2.7deg) translate(2px, 1px); }
    }

    @keyframes music-note-dance {
      0%, 100% { transform: translate(-50%, -50%) rotate(-5deg) scale(1); }
      35% { transform: translate(-50%, -63%) rotate(7deg) scale(1.12); }
      62% { transform: translate(-50%, -48%) rotate(-2deg) scale(.96); }
    }

    @keyframes speaker-pulse-left {
      0% { transform: translate(-50%, -50%) rotate(-3deg) scale(1); }
      100% { transform: translate(-58%, -53%) rotate(-7deg) scale(1.14, 1.08); }
    }

    @keyframes speaker-pulse-right {
      0% { transform: translate(-50%, -50%) rotate(3deg) scale(1); }
      100% { transform: translate(-42%, -53%) rotate(7deg) scale(1.14, 1.08); }
    }

    @media (max-width: 1050px) {
      #summer-checkin-app .quick-checkins { grid-template-columns: repeat(5, minmax(110px, 1fr)); }
      #summer-checkin-app .badge-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 620px) {
      #summer-checkin-app { gap: 12px; }
      #summer-checkin-app .status-strip { align-items: flex-start; }
      #summer-checkin-app .map-shell { border-radius: 6px; }
      #summer-checkin-app .hotspot { width: 16%; height: 20%; }
      #summer-checkin-app .quick-checkins { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      #summer-checkin-app .task-btn { padding: 8px; }
      #summer-checkin-app .badge-grid { grid-template-columns: 1fr; }
      #summer-checkin-app .medal { grid-template-columns: 42px minmax(0, 1fr); }
      #summer-checkin-app .medal-mark { width: 42px; }
      #summer-checkin-app .map-toast { max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
      #summer-checkin-app .flag-marker { transform: translateX(-50%) scale(.7); }
      #summer-checkin-app .flag-marker.reached { transform: translateX(-50%) scale(.86); }
    }

    @media (min-width: 700px) and (max-width: 1366px) {
      #summer-checkin-app {
        gap: 8px;
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
      }
      #summer-checkin-app .map-shell {
        order: 1;
        width: 100%;
        max-width: 1240px;
        justify-self: center;
      }
      #summer-checkin-app .bottom-zone { order: 2; padding-top: 6px; gap: 8px; }
      #summer-checkin-app .status-strip { order: 3; }
      #summer-checkin-app > section[aria-label="快速打卡"] { order: 4; }
      #summer-checkin-app > section[aria-label="打卡记录"] { order: 5; }
      #summer-checkin-app .map-stage { max-height: none; }
      #summer-checkin-app .progress-head { margin-bottom: 5px; }
      #summer-checkin-app .progress-wrap { padding-top: 24px; }
      #summer-checkin-app .badge-head { margin-bottom: 4px; }
      #summer-checkin-app .badge-grid {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 2px;
        scroll-snap-type: x proximity;
      }
      #summer-checkin-app .medal {
        flex: 0 0 218px;
        min-height: 58px;
        grid-template-columns: 44px minmax(0, 1fr);
        scroll-snap-align: start;
      }
      #summer-checkin-app .medal-mark { width: 44px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #summer-checkin-app .pig,
      #summer-checkin-app .progress-fill,
      #summer-checkin-app .map-toast { transition: none; }
      #summer-checkin-app .hotspot.is-bump { animation: none; }
      #summer-checkin-app .star-pop,
      #summer-checkin-app .star-pop::before,
      #summer-checkin-app .star-pop::after { animation-duration: .01ms; }
      #summer-checkin-app .wobble-piece,
      #summer-checkin-app .music-note-dancer,
      #summer-checkin-app .music-speaker { animation: none; }
    }
  </style>

  <section class="status-strip" aria-label="冒险状态">
    <div class="status-copy">
      <strong>冒险进度</strong>
      <span class="text-muted" id="statusText">从起点出发</span>
    </div>
    <div class="reward-totals">
      <span class="reward-chip">⭐ <strong id="starCount">0</strong> 颗</span>

      const badges = [
        { id: 'sport', mark: '动', name: '运动岛勇士', desc: '连续体育 7 天', unlocked: s => longestSportStreak(s.logs) >= 7 },
        { id: 'english', mark: '英', name: '英语湾船长', desc: '从 7 月 17 日坚持到 8 月 3 日', unlocked: s => s.counts.english >= 15 },
        { id: 'calculation', mark: '算', name: '计算山高手', desc: '完成 27 次数学计算', unlocked: s => s.counts.calculation >= 27 },
        { id: 'writing', mark: '字', name: '练字桥小书法家', desc: '完成 33 次练字', unlocked: s => s.counts.writing >= 33 },
        { id: 'thinking', mark: '思', name: '思维森林探险家', desc: '完成 23 页数学练习', unlocked: s => s.counts.thinking >= 23 },
        { id: 'go', mark: '棋', name: '围棋洞小棋士', desc: '围棋死活累计 10 次', unlocked: s => s.counts.go >= 10 },
        { id: 'picture', mark: '画', name: '看图写话小作家', desc: '累计 10 次，15 次满级', unlocked: s => s.counts.picture >= 10 },
        { id: 'fun', mark: '趣', name: '任务屋管理员', desc: '完成 10 次趣味任务', unlocked: s => s.counts.fun >= 10 },
        { id: 'outdoor', mark: '户', name: '周六户外旗手', desc: '参加 4 次周六户外', unlocked: s => s.counts.outdoor >= 4 },
        { id: 'finish', mark: '宝', name: '终点宝藏王', desc: '走完整张冒险地图', unlocked: s => totalSteps(s) >= totalGoal }
      ];

      const route = [
        [8, 30], [16, 26], [24, 23], [34, 22], [46, 23], [58, 23],
        [70, 27], [82, 31], [84, 40], [76, 46], [66, 51], [55, 60],
        [47, 54], [39, 47], [29, 43], [24, 52], [18, 64], [25, 70],
        [37, 66], [46, 62], [55, 60], [65, 64], [74, 62], [83, 62],
        [87, 70], [87, 80], [84, 89]
      ];

      const routeSegments = [];
      let routeLength = 0;
      for (let i = 1; i < route.length; i += 1) {
        const dx = route[i][0] - route[i - 1][0];
        const dy = route[i][1] - route[i - 1][1];
        const length = Math.hypot(dx, dy);
        routeSegments.push({ from: route[i - 1], to: route[i], start: routeLength, length });
        routeLength += length;
      }

      function emptyState() {
        const counts = {};
        taskOrder.forEach(id => { counts[id] = 0; });
        return { counts, logs: [], unlocked: [] };
      }

      function loadState() {
        try {
          const parsed = JSON.parse(localStorage.getItem(storageKey));
          if (!parsed || !parsed.counts || !Array.isArray(parsed.logs)) return emptyState();
          const next = emptyState();
          taskOrder.forEach(id => { next.counts[id] = Math.min(tasks[id].goal, Number(parsed.counts[id]) || 0); });
          next.logs = parsed.logs.filter(log => tasks[log.taskId]).slice(0, totalGoal);
          next.unlocked = Array.isArray(parsed.unlocked) ? parsed.unlocked : [];
          return next;
        } catch (_) {
          return emptyState();
        }
      }

      function saveState() {
        try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch (_) {}
      }

      function totalSteps(s = state) {
        return taskOrder.reduce((sum, id) => sum + s.counts[id], 0);
      }

      function localDateKey(value) {
        const date = new Date(value);
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      function longestSportStreak(logs) {
        const days = [...new Set(logs.filter(log => log.taskId === 'sport').map(log => localDateKey(log.at)))].sort();
        let longest = 0;
        let current = 0;
        let previous = null;
        days.forEach(day => {
          const date = new Date(`${day}T12:00:00`);
          if (!previous) current = 1;
          else {
            const gap = Math.round((date - previous) / 86400000);
            current = gap === 1 ? current + 1 : 1;
          }
          longest = Math.max(longest, current);
          previous = date;
        });
        return longest;
      }

      function routePosition(ratio) {
        const target = Math.max(0, Math.min(1, ratio)) * routeLength;
        const segment = routeSegments.find(item => target <= item.start + item.length) || routeSegments[routeSegments.length - 1];
        const amount = segment.length ? Math.max(0, Math.min(1, (target - segment.start) / segment.length)) : 0;
        return {
          x: segment.from[0] + (segment.to[0] - segment.from[0]) * amount,
          y: segment.from[1] + (segment.to[1] - segment.from[1]) * amount
        };
      }

      function formatTime(value) {
        const date = new Date(value);
        return new Intl.DateTimeFormat('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(date);
      }

      let state = loadState();
      let toastTimer = null;
      let audioContext = null;
      let activeVoice = null;
      let backgroundStarted = false;
      let shouldResumeBackground = false;
      const voiceBags = { island: [], sun: [], firework: [] };
      const lastVoiceIndex = { island: -1, sun: -1, firework: -1 };
      const backgroundAudio = root.querySelector('#backgroundAudio');
      const backgroundTracks = JSON.parse(root.querySelector('#backgroundAudioList')?.textContent || '[]')
        .map(track => typeof track === 'string' ? { src: track, bytes: 0 } : track)
        .filter(track => track && track.src);
      const backgroundQueueKey = 'summer-adventure-background-queue-v1';
      const backgroundTrackIds = backgroundTracks.map(track => track.src);
      let backgroundCacheRequested = false;
      let backgroundCachePending = false;

      function syncUnlocks() {
        const unlocked = new Set(state.unlocked);
        if (state.counts.fun < 10) unlocked.delete('fun');
        badges.forEach(badge => {
          if (badge.unlocked(state)) unlocked.add(badge.id);
        });
        state.unlocked = [...unlocked];
      }

      function showToast(message) {
        const toast = root.querySelector('#mapToast');
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 1500);
      }

      function popStar(sourceButton, point) {
        if (!sourceButton) return;
        const sourceBox = sourceButton.getBoundingClientRect();
        const sourceX = point ? point.clientX : sourceBox.left + sourceBox.width / 2;
        const sourceY = point ? point.clientY : sourceBox.top + sourceBox.height / 2;
        const star = document.createElement('span');
        star.className = 'star-pop';
        star.setAttribute('aria-hidden', 'true');
        star.textContent = '⭐';
        star.style.left = `${sourceX}px`;
        star.style.top = `${sourceY}px`;
        root.appendChild(star);
        star.addEventListener('animationend', () => star.remove(), { once: true });
        setTimeout(() => star.remove(), 1000);
      }

      function playCheckinSound() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!audioContext) audioContext = new AudioContextClass();

        const play = () => {
          const now = audioContext.currentTime;
          [659.25, 783.99, 1046.5].forEach((frequency, index) => {
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const start = now + index * 0.065;
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(frequency, start);
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(0.085, start + 0.018);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.19);
            oscillator.connect(gain);
            gain.connect(audioContext.destination);
            oscillator.start(start);
            oscillator.stop(start + 0.2);
          });
        };

        if (audioContext.state === 'suspended') audioContext.resume().then(play).catch(() => {});
        else play();
      }

      function shuffleList(list) {
        const bag = [...list];
        for (let index = bag.length - 1; index > 0; index -= 1) {
          const other = Math.floor(Math.random() * (index + 1));
          [bag[index], bag[other]] = [bag[other], bag[index]];
        }
        return bag;
      }

      function refillVoiceBag(kind, pool) {
        let bag = [];
        pool.forEach((audio, index) => {
          const weight = Math.max(1, Number(audio.dataset.voiceWeight) || 1);
          for (let count = 0; count < weight; count += 1) bag.push(index);
        });
        bag = shuffleList(bag);
        for (let index = 1; index < bag.length; index += 1) {
          if (bag[index] === bag[index - 1]) {
            const swapIndex = bag.findIndex((value, candidate) => candidate > index && value !== bag[index - 1]);
            if (swapIndex > index) [bag[index], bag[swapIndex]] = [bag[swapIndex], bag[index]];
          }
        }
        if (bag.length > 1 && bag[bag.length - 1] === lastVoiceIndex[kind]) {
          const swapIndex = bag.findIndex(value => value !== lastVoiceIndex[kind]);
          if (swapIndex >= 0) [bag[bag.length - 1], bag[swapIndex]] = [bag[swapIndex], bag[bag.length - 1]];
        }
        voiceBags[kind] = bag;
      }

      function readBackgroundQueue() {
        try {
          const saved = JSON.parse(localStorage.getItem(backgroundQueueKey));
          if (!saved || !Array.isArray(saved.queue) || !Array.isArray(saved.tracks)) return null;
          if (saved.tracks.join('|') !== backgroundTrackIds.join('|')) return null;
          return {
            queue: saved.queue.filter(index => Number.isInteger(index) && backgroundTracks[index]),
            last: Number.isInteger(saved.last) ? saved.last : -1
          };
        } catch (_) {
          return null;
        }
      }

      function writeBackgroundQueue(queue, last) {
        try {
          localStorage.setItem(backgroundQueueKey, JSON.stringify({ tracks: backgroundTrackIds, queue, last }));
        } catch (_) {}
      }

      function createBackgroundQueue(last = -1) {
        const queue = shuffleList(backgroundTracks.map((_, index) => index));
        if (queue.length > 1 && queue[queue.length - 1] === last) {
          const swapIndex = queue.findIndex(index => index !== last);
          if (swapIndex >= 0) [queue[queue.length - 1], queue[swapIndex]] = [queue[swapIndex], queue[queue.length - 1]];
        }
        return queue;
      }

      function takeBackgroundIndex() {
        if (!backgroundTracks.length) return -1;
        const saved = readBackgroundQueue();
        let queue = saved?.queue || [];
        let last = saved?.last ?? -1;
        if (!queue.length) queue = createBackgroundQueue(last);
        const nextIndex = queue.pop();
        last = nextIndex;
        writeBackgroundQueue(queue, last);
        return nextIndex;
      }

      function playNextBackground() {
        if (!backgroundAudio || !backgroundTracks.length) return;
        requestBackgroundCache();
        const nextIndex = takeBackgroundIndex();
        if (nextIndex < 0) return;
        backgroundStarted = true;
        backgroundAudio.src = backgroundTracks[nextIndex].src;
        backgroundAudio.volume = activeVoice ? 0.045 : 0.18;
        backgroundAudio.play().catch(() => {
          backgroundStarted = false;
        });
      }

      function requestBackgroundCache() {
        if (backgroundCacheRequested || !backgroundTracks.length) return;
        if (!navigator.serviceWorker?.controller) {
          if (backgroundCachePending) return;
          backgroundCachePending = true;
          navigator.serviceWorker?.ready?.then(() => {
            backgroundCachePending = false;
            if (navigator.serviceWorker?.controller && !backgroundCacheRequested) requestBackgroundCache();
          }).catch(() => {});
          return;
        }
        backgroundCacheRequested = true;
        navigator.serviceWorker.controller.postMessage({
          type: 'CACHE_BACKGROUND_TRACKS',
          assets: backgroundTracks.map(track => track.src)
        });
      }

      function startBackgroundMusic() {
        if (backgroundStarted || !backgroundAudio || !backgroundTracks.length) return;
        requestBackgroundCache();
        if (!backgroundAudio.src) playNextBackground();
        else {
          backgroundStarted = true;
          backgroundAudio.volume = activeVoice ? 0.045 : 0.18;
          backgroundAudio.play().catch(() => {
            backgroundStarted = false;
          });
        }
      }

      function playMusicControl() {
        if (!backgroundAudio || !backgroundTracks.length) return;
        if (!backgroundStarted && backgroundAudio.src && backgroundAudio.paused) {
          startBackgroundMusic();
          return;
        }
        playNextBackground();
      }

      function resumeBackgroundMusic() {
        if (!backgroundAudio || !backgroundTracks.length || !shouldResumeBackground) return;
        backgroundStarted = true;
        if (!backgroundAudio.src) {
          playNextBackground();
          return;
        }
        backgroundAudio.volume = activeVoice ? 0.045 : 0.18;
        backgroundAudio.play().catch(() => {
          backgroundStarted = false;
        });
      }

      function pauseBackgroundMusic() {
        if (!backgroundAudio) return;
        shouldResumeBackground = backgroundStarted && !backgroundAudio.paused;
        backgroundAudio.pause();
        voiceBags.island = [];
        voiceBags.sun = [];
        voiceBags.firework = [];
      }

      function duckBackground(isDucked) {
        if (!backgroundAudio) return;
        backgroundAudio.volume = isDucked ? 0.045 : 0.18;
      }

      function playRandomVoice(kind, fallback) {
        const pool = [...root.querySelectorAll(`audio[data-voice-kind="${kind}"]`)];
        if (!pool.length) {
          if (fallback) fallback();
          return;
        }
        if (!voiceBags[kind].length) refillVoiceBag(kind, pool);
        const voiceIndex = voiceBags[kind].pop();
        const audio = pool[voiceIndex];
        lastVoiceIndex[kind] = voiceIndex;

        if (activeVoice && activeVoice !== audio) {
          activeVoice.pause();
          activeVoice.currentTime = 0;
        }
        audio.pause();
        audio.currentTime = 0;
        audio.volume = 1;
        activeVoice = audio;
        duckBackground(true);
        const result = audio.play();
        if (result && typeof result.catch === 'function') {
          result.catch(() => {
            activeVoice = null;
            duckBackground(false);
            if (fallback) fallback();
          });
        }
        audio.onended = () => {
          if (activeVoice === audio) activeVoice = null;
          duckBackground(false);
        };
      }

      function withAudioContext(play) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!audioContext) audioContext = new AudioContextClass();
        if (audioContext.state === 'suspended') audioContext.resume().then(() => play(audioContext)).catch(() => {});
        else play(audioContext);
      }

      const recordingTimers = new Map();

      function playRecording(id, maxDuration, volume = .8) {
        const audio = root.querySelector(`#${id}`);
        if (!audio) return;
        const previousTimer = recordingTimers.get(id);
        if (previousTimer) clearTimeout(previousTimer);
        audio.pause();
        audio.currentTime = 0;
        audio.volume = volume;
        const result = audio.play();
        if (result && typeof result.catch === 'function') result.catch(() => {});
        recordingTimers.set(id, setTimeout(() => {
          audio.pause();
          audio.currentTime = 0;
        }, maxDuration));
      }

      function soundDolphin() {
        playRecording('dolphinAudio', 3600, .82);
        showToast('海豚在为你欢呼！');
      }

      function soundShip() {
        playRecording('shipAudio', 2800, .55);
        showToast('嘟——冒险号启航！');
      }

      function synthFireworks() {
        withAudioContext(context => {
          const now = context.currentTime;
          const duration = .85;
          const buffer = context.createBuffer(1, Math.ceil(context.sampleRate * duration), context.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < data.length; i += 1) {
            const envelope = Math.exp(-7 * i / data.length);
            data[i] = (Math.random() * 2 - 1) * envelope;
          }
          const noise = context.createBufferSource();
          const filter = context.createBiquadFilter();
          const gain = context.createGain();
          noise.buffer = buffer;
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1300, now);
          filter.frequency.exponentialRampToValueAtTime(180, now + duration);
          gain.gain.setValueAtTime(.16, now);
          gain.gain.exponentialRampToValueAtTime(.0001, now + duration);
          noise.connect(filter).connect(gain).connect(context.destination);
          noise.start(now);
          const boom = context.createOscillator();
          const boomGain = context.createGain();
          boom.type = 'sine';
          boom.frequency.setValueAtTime(78, now);
          boom.frequency.exponentialRampToValueAtTime(34, now + .55);
          boomGain.gain.setValueAtTime(.12, now);
          boomGain.gain.exponentialRampToValueAtTime(.0001, now + .62);
          boom.connect(boomGain).connect(context.destination);
          boom.start(now);
          boom.stop(now + .65);
        });
      }

      function soundFireworks() {
        playRandomVoice('firework', synthFireworks);
        showToast('砰！烟花为你绽放！');
      }

      function soundSeagull() {
        playRecording('seagullAudio', 1900, .72);
        showToast('海鸥来打招呼啦！');
      }

      function speakPraise() {
        playRandomVoice('sun', playCheckinSound);
        showToast('☀ 热情太阳来夸奖你啦！');
      }

      function playScene(scene) {
        if (scene === 'dolphin') soundDolphin();
        else if (scene === 'ship') soundShip();
        else if (scene === 'fireworks') soundFireworks();
        else if (scene === 'seagull') soundSeagull();
        else if (scene === 'sun') speakPraise();
      }

      function checkIn(taskId, sourceButton, point) {
        const task = tasks[taskId];
        if (!task || state.counts[taskId] >= task.goal) {
          if (task) showToast(`${task.station}已经完成全部目标`);
          return;
        }

        state.counts[taskId] += 1;
        state.logs.unshift({ taskId, at: new Date().toISOString() });
        popStar(sourceButton, point);
        playRandomVoice('island', playCheckinSound);
        syncUnlocks();
        saveState();
        render();
        showToast(`${task.short} +1，小猪前进一步！`);

        if (sourceButton) {
          sourceButton.classList.remove('is-bump');
          void sourceButton.offsetWidth;
          sourceButton.classList.add('is-bump');
        }
        if (navigator.vibrate) navigator.vibrate(20);
      }

      function undoLast() {
        const last = state.logs.shift();
        if (!last) return;
        state.counts[last.taskId] = Math.max(0, state.counts[last.taskId] - 1);
        saveState();
        render();
        showToast(`已撤销：${tasks[last.taskId].short}`);
      }

      function renderTaskButtons() {
        const container = root.querySelector('#taskButtons');
        container.innerHTML = taskOrder.map(id => {
          const task = tasks[id];
          const count = state.counts[id];
          const done = count >= task.goal;
          return `<button class="task-btn" type="button" data-quick-task="${id}" ${done ? 'disabled' : ''} aria-label="${task.short}打卡，当前 ${count}，目标 ${task.goal}"><strong>${task.short}</strong><span>${count} / ${task.goal}${done ? ' · 已完成' : ''}</span></button>`;
        }).join('');
      }

      function renderActivity() {
        const list = root.querySelector('#activityList');
        if (!state.logs.length) {
          list.innerHTML = '';
          return;
        }
        list.innerHTML = state.logs.slice(0, 12).map(log => {
          const task = tasks[log.taskId];
          return `<span class="activity-item"><strong>${task.short}</strong><span class="text-small">${formatTime(log.at)}</span></span>`;
        }).join('');
      }

      function renderBadges() {
        const unlocked = new Set(state.unlocked);
        const grid = root.querySelector('#badgeGrid');
        grid.innerHTML = badges.map(badge => {
          const isUnlocked = unlocked.has(badge.id);
          return `<article class="medal ${isUnlocked ? 'unlocked' : ''}" aria-label="${badge.name}，${isUnlocked ? '已点亮' : '未点亮'}"><span class="medal-mark">${badge.mark}</span><span class="medal-copy"><strong>${badge.name}</strong><span>${badge.desc}</span></span></article>`;
        }).join('');
        root.querySelector('#badgeSummary').textContent = `${badges.filter(badge => unlocked.has(badge.id)).length} / ${badges.length} 已点亮`;
      }

      function renderFlags(steps) {
        const rail = root.querySelector('#flagRail');
        const markerCount = Math.floor(totalGoal / 5);
        rail.innerHTML = Array.from({ length: markerCount }, (_, index) => {
          const target = (index + 1) * 5;
          const reached = steps >= target;
          const left = target / totalGoal * 100;
          return `<span class="flag-marker ${reached ? 'reached' : ''}" style="left:${left}%" aria-label="第 ${index + 1} 面小旗，${reached ? '已点亮' : `还差 ${target - steps} 次打卡`}"></span>`;
        }).join('');
      }

      function render() {
        syncUnlocks();
        const steps = totalSteps();
        const ratio = steps / totalGoal;
        const percent = Math.round(ratio * 100);
        const flags = Math.floor(steps / 5);
        const remainder = steps % 5;
        const starsToNextFlag = remainder === 0 ? 5 : 5 - remainder;
        const position = routePosition(ratio);

        root.querySelector('#starCount').textContent = steps;
        root.querySelector('#flagCount').textContent = flags;
        root.querySelector('#statusText').textContent = steps >= totalGoal
          ? '已经抵达终点，宝藏王诞生！'
          : steps
            ? `已走 ${steps} 步，还有 ${totalGoal - steps} 步到终点；下一面小旗还差 ${starsToNextFlag} 颗星星`
            : `从起点出发，共 ${totalGoal} 步到达宝藏`;
        root.querySelector('#progressDetail').textContent = `${steps} / ${totalGoal} 步`;
        root.querySelector('#progressLabel').textContent = `${percent}%`;
        root.querySelector('#progressFill').style.width = `${percent}%`;
        const track = root.querySelector('#progressTrack');
        track.setAttribute('aria-valuenow', String(steps));

        const pig = root.querySelector('#pig');
        pig.style.left = `${position.x}%`;
        pig.style.top = `${position.y}%`;

        root.querySelectorAll('[data-task]').forEach(button => {
          const id = button.dataset.task;
          button.disabled = state.counts[id] >= tasks[id].goal;
        });

        root.querySelector('#undoBtn').disabled = !state.logs.length;
        renderTaskButtons();
        renderActivity();
        renderFlags(steps);
        renderBadges();
        saveState();
      }

      root.addEventListener('click', event => {
        const music = event.target.closest('[data-music-control]');
        if (music && root.contains(music)) {
          playMusicControl();
          return;
        }
        const scenery = event.target.closest('[data-scene]');
        if (scenery && root.contains(scenery)) {
          playScene(scenery.dataset.scene);
          return;
        }
        const hotspot = event.target.closest('[data-task]');
        if (hotspot && root.contains(hotspot)) {
          checkIn(hotspot.dataset.task, hotspot, { clientX: event.clientX, clientY: event.clientY });
          return;
        }
        const quick = event.target.closest('[data-quick-task]');
        if (quick && root.contains(quick)) checkIn(quick.dataset.quickTask, quick);
      });

      if (backgroundAudio) backgroundAudio.addEventListener('ended', playNextBackground);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) pauseBackgroundMusic();
        else resumeBackgroundMusic();
      });
      window.addEventListener('pagehide', pauseBackgroundMusic);
      window.addEventListener('pageshow', resumeBackgroundMusic);
      window.addEventListener('focus', resumeBackgroundMusic);
      navigator.serviceWorker?.addEventListener('controllerchange', () => {
        if (backgroundStarted) requestBackgroundCache();
      });

      root.querySelector('#undoBtn').addEventListener('click', undoLast);
      render();
    })();
  </script>
</div>
</main>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
